<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Paste into Textbox</title>
        <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
        <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <style>
        .container {
            display: flex;
            flex-direction: column;
        }
        .input-text, .output-text {
            width: 97%;
            height: 100px;
            border: 1px solid #000000;
            padding: 10px;
            margin: 10px 0;
        }
        #hButton {
            padding: 10px 10px;
            background-color: #000000;
            color: white;
        }

    </style>
</head>
<body>
    <h1>Welcome to My Website</h1>
    <div class="container">
        <textarea id="input-text" class="input-text" placeholder="Paste your text here..." /></textarea>
    </div>

    <button id="hButton">Humanize</button>

    <div class="container">
        <div id="output-text" class="output-text"> Your Humanized text will appear here...</div>
    </div>
    <script src="script.js"></script>
</body>
</html>
