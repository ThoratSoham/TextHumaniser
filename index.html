<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paste into Textbox</title>
    <style>
        .container {
            display: flex;
            flex-direction: column;
        }
        .input-text, .output-text {
            width: 100%;
            height: 100px;
            border: 1px solid #000000;
            padding: 10px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <h1>Welcome to My Website</h1>
    <div class="container">
        <div class="input-text"> Paste your text here...</div>
    </div>
    <input type="button" value="Humanize" onclick="alert('button clicked')">
    <div class="container">
        <div class="output-text"> Your Humanized text will appear here...</div>
    </div>
</body>
</html>
